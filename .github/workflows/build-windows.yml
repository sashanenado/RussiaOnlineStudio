name: Build Windows Studio and Overlay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Data/**'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Studio
        run: dotnet publish src/Studio/Studio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist/RussiaOnline/studio_tmp
      - name: Publish Overlay
        run: dotnet publish src/Overlay/Overlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist/RussiaOnline/overlay_tmp
      - name: Assemble portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/RussiaOnline/Data | Out-Null
          Copy-Item dist/RussiaOnline/studio_tmp/Studio.exe dist/RussiaOnline/Studio.exe
          Copy-Item dist/RussiaOnline/overlay_tmp/Overlay.exe dist/RussiaOnline/Overlay.exe
          Copy-Item Data/* dist/RussiaOnline/Data/ -Recurse -Force
          Remove-Item dist/RussiaOnline/studio_tmp,dist/RussiaOnline/overlay_tmp -Recurse -Force
          Set-Content dist/RussiaOnline/НАЧНИ_ОТСЮДА.txt "Запусти Studio.exe для редактирования. Запусти Overlay.exe для окон поверх игры. Оба приложения используют папку Data. F8 — выход, F9 — скрыть/показать, F10 — панель, F11 — режим перемещения."
          Compress-Archive -Path dist/RussiaOnline/* -DestinationPath dist/RussiaOnline_Studio_Overlay_win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: RussiaOnlineStudio-Overlay-win-x64
          path: dist/RussiaOnline_Studio_Overlay_win-x64.zip
          retention-days: 14
