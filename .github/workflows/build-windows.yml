name: Build Windows Studio and Overlay

concurrency:
  group: russia-online-windows-build
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Data/**'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate law database before publishing
        shell: pwsh
        run: |
          $db = Get-Content Data/laws_database.json -Raw | ConvertFrom-Json
          if (-not $db.Bases) { throw "Data/laws_database.json has no Bases object." }
          $expected = @("ук", "КОАП", "ПК")
          foreach ($key in $expected) {
            if ($null -eq $db.Bases.$key) { throw "Missing base category: $key" }
          }
          $counts = @{}
          foreach ($p in $db.Bases.PSObject.Properties) {
            if ($p.Value -isnot [array]) { throw "Category $($p.Name) must be an array." }
            $counts[$p.Name] = $p.Value.Count
          }
          Write-Host "Law database is valid. Category counts:"
          $counts.GetEnumerator() | Sort-Object Name | Format-Table -AutoSize
      - name: Validate extended Arbat catalog
        shell: pwsh
        run: |
          $files = @(Get-ChildItem Data/ExtendedLaws -Filter *.json -File)
          if ($files.Count -ne 24) { throw "Expected 24 extended law group files, found $($files.Count)." }
          $total = 0
          foreach ($file in $files) {
            $group = Get-Content $file.FullName -Raw | ConvertFrom-Json
            if ([string]::IsNullOrWhiteSpace($group.Category)) { throw "Missing Category in $($file.Name)." }
            if ($null -eq $group.Articles -or $group.Articles -isnot [array]) { throw "Articles array missing in $($file.Name)." }
            $ids = @($group.Articles | ForEach-Object { $_.Id } | Where-Object { $_ })
            if ($ids.Count -ne $group.Articles.Count) { throw "Missing stable IDs in $($file.Name)." }
            if (($ids | Sort-Object -Unique).Count -ne $ids.Count) { throw "Duplicate IDs in $($file.Name)." }
            $total += $group.Articles.Count
          }
          if ($total -lt 2500) { throw "Extended catalog unexpectedly small: $total entries." }
          Write-Host "Validated $($files.Count) extended categories and $total Arbat units."
          $rules = Get-Content Data/rules_docs.json -Raw | ConvertFrom-Json
          $pgo = $rules | Where-Object { $_.id -eq "11" }
          if ($null -eq $pgo -or $pgo.count -ne 118) { throw "PGO source metadata missing or changed." }
      - name: Publish Studio
        run: dotnet publish src/Studio/Studio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist/RussiaOnline/studio_tmp
      - name: Publish Overlay
        run: dotnet publish src/Overlay/Overlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist/RussiaOnline/overlay_tmp
      - name: Assemble portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/RussiaOnline/Data | Out-Null
          Copy-Item dist/RussiaOnline/studio_tmp/Studio.exe dist/RussiaOnline/Studio.exe
          Copy-Item dist/RussiaOnline/overlay_tmp/Overlay.exe dist/RussiaOnline/Overlay.exe
          Copy-Item Data/* dist/RussiaOnline/Data/ -Recurse -Force
          Remove-Item dist/RussiaOnline/studio_tmp,dist/RussiaOnline/overlay_tmp -Recurse -Force
          @"
          RUSSIA ONLINE STUDIO + OVERLAY

          1. Запусти Studio.exe. Библиотека законов открывается сразу.
          2. Войди на форум во вкладке «Форум / браузер». WebView2 хранит вход в Data/ForumBrowserProfile.
          3. Статьи редактируются в Studio; изменения автоматически появляются в окне «Памятка законов» Overlay.
          4. Для отдельных памяток используй «Конструктор панелей».
          5. Запусти Overlay.exe. Горячие клавиши: F8 — выход, F9 — показать/скрыть все окна, F10 — панель управления, F11 — свободное перемещение.
          6. Резервируй Data целиком. При обновлении программы переноси Data/Profiles и Data/overlay_positions.json.
          7. Не передавай участникам семьи папку Data/ForumBrowserProfile: в ней хранится личная сессия форума.
          8. Для встроенного браузера требуется Microsoft Edge WebView2 Runtime.
          "@ | Set-Content -Encoding UTF8 dist/RussiaOnline/НАЧНИ_ОТСЮДА.txt
          Compress-Archive -Path dist/RussiaOnline/* -DestinationPath dist/RussiaOnline_Studio_Overlay_win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: RussiaOnlineStudio-Overlay-win-x64
          path: dist/RussiaOnline_Studio_Overlay_win-x64.zip
          retention-days: 14
