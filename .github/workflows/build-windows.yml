name: Build Windows Studio and Overlay

concurrency:
  # Keep main and development builds isolated; never cancel a publish already running.
  group: russia-online-windows-build-${{ github.ref }}
  cancel-in-progress: false
on:
  workflow_dispatch:
  push:
    branches: [main, development]
    paths:
      - 'src/**'
      - 'Data/**'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate project XML and all JSON files
        shell: pwsh
        run: |
          $xmlFiles = @(Get-ChildItem src -Recurse -File -Include *.xaml,*.csproj)
          foreach ($file in $xmlFiles) {
            try { [xml](Get-Content $file.FullName -Raw) | Out-Null }
            catch { throw "Invalid XML in $($file.FullName): $($_.Exception.Message)" }
          }

          $jsonFiles = @(Get-ChildItem Data -Recurse -File -Filter *.json)
          foreach ($file in $jsonFiles) {
            try { Get-Content $file.FullName -Raw | ConvertFrom-Json -ErrorAction Stop | Out-Null }
            catch { throw "Invalid JSON in $($file.FullName): $($_.Exception.Message)" }
          }
          Write-Host "Validated $($xmlFiles.Count) XAML/project XML files and $($jsonFiles.Count) JSON files."

      - name: Validate law database before publishing
        shell: pwsh
        run: |
          $db = Get-Content Data/laws_database.json -Raw | ConvertFrom-Json
          if (-not $db.Bases) { throw "Data/laws_database.json has no Bases object." }
          $expected = @("ук", "КОАП", "ПК")
          foreach ($key in $expected) {
            if ($null -eq $db.Bases.$key) { throw "Missing base category: $key" }
          }
          $counts = @{}
          foreach ($p in $db.Bases.PSObject.Properties) {
            if ($p.Value -isnot [array]) { throw "Category $($p.Name) must be an array." }
            $counts[$p.Name] = $p.Value.Count
          }
          Write-Host "Law database is valid. Category counts:"
          $counts.GetEnumerator() | Sort-Object Name | Format-Table -AutoSize
      - name: Validate full Arbat legal catalogue
        shell: pwsh
        run: |
          $files = @(Get-ChildItem Data/ExtendedLaws -Filter *.json -File)
          if ($files.Count -ne 27) { throw "Expected 27 Arbat legal documents, found $($files.Count)." }
          $total = 0
          $categories = @{}
          foreach ($file in $files) {
            $group = Get-Content $file.FullName -Raw | ConvertFrom-Json
            if ($group.Server -ne "Арбатский") { throw "Wrong or missing server in $($file.Name): $($group.Server)" }
            if ([string]::IsNullOrWhiteSpace($group.Category)) { throw "Missing full document heading in $($file.Name)." }
            if ($categories.ContainsKey($group.Category)) { throw "Duplicate document heading: $($group.Category)" }
            $categories[$group.Category] = $true
            if ([string]::IsNullOrWhiteSpace($group.SourceUrl) -or [string]::IsNullOrWhiteSpace($group.SourceForumUrl)) {
              throw "Missing source link in $($file.Name)."
            }
            if ($null -eq $group.Articles -or $group.Articles -isnot [array] -or $group.Articles.Count -eq 0) {
              throw "Articles array missing or empty in $($file.Name)."
            }
            $ids = @($group.Articles | ForEach-Object { $_.Id } | Where-Object { $_ })
            if ($ids.Count -ne $group.Articles.Count) { throw "Missing stable IDs in $($file.Name)." }
            if (($ids | Sort-Object -Unique).Count -ne $ids.Count) { throw "Duplicate IDs in $($file.Name)." }
            if (@($group.Articles | Where-Object { $_.SourceServer -ne "Арбатский" }).Count -gt 0) {
              throw "A non-Arbat article was found in $($file.Name)."
            }
            if (@($group.Articles | Where-Object { [string]::IsNullOrWhiteSpace($_.Text) }).Count -gt 0) {
              throw "An empty article body was found in $($file.Name)."
            }
            $total += $group.Articles.Count
          }
          if ($total -lt 1000) { throw "Arbat catalogue unexpectedly small: $total article/rule entries." }
          $manifest = Get-Content Data/law_catalog.json -Raw | ConvertFrom-Json
          if ($manifest.Count -ne 27) { throw "Data/law_catalog.json must contain exactly 27 documents." }
          Write-Host "Validated $($files.Count) full-title Arbat documents and $total article/rule entries."
          $rules = Get-Content Data/rules_docs.json -Raw | ConvertFrom-Json
          $pgo = $rules | Where-Object { $_.id -eq "11" }
          if ($null -eq $pgo -or $pgo.count -ne 118) { throw "PGO source metadata missing or changed." }
      - name: Publish Studio
        run: dotnet publish src/Studio/Studio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist/RussiaOnline/studio_tmp
      - name: Publish Overlay
        run: dotnet publish src/Overlay/Overlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist/RussiaOnline/overlay_tmp
      - name: Assemble portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/RussiaOnline/Data | Out-Null
          Copy-Item dist/RussiaOnline/studio_tmp/Studio.exe dist/RussiaOnline/Studio.exe
          Copy-Item dist/RussiaOnline/overlay_tmp/Overlay.exe dist/RussiaOnline/Overlay.exe
          Copy-Item Data/* dist/RussiaOnline/Data/ -Recurse -Force
          Remove-Item dist/RussiaOnline/studio_tmp,dist/RussiaOnline/overlay_tmp -Recurse -Force
          @"
          RUSSIA ONLINE STUDIO + OVERLAY

          1. Запусти Studio.exe. Библиотека законов открывается сразу.
          2. Войди на форум во вкладке «Форум / браузер». WebView2 хранит вход в профиле текущего пользователя Windows (LocalAppData).
          3. Статьи редактируются в Studio; изменения автоматически появляются в окне «Памятка законов» Overlay.
          4. Для отдельных памяток используй «Конструктор панелей».
          5. Запусти Overlay.exe. Горячие клавиши: F8 — выход, F9 — показать/скрыть все окна, F10 — панель управления, F11 — свободное перемещение.
          6. Резервируй Data целиком. При обновлении программы переноси Data/Profiles и Data/overlay_positions.json.
          7. Папка сессии форума находится в LocalAppData текущего пользователя Windows и не входит в переносимую Data.
          8. Для встроенного браузера требуется Microsoft Edge WebView2 Runtime.
          "@ | Set-Content -Encoding UTF8 dist/RussiaOnline/НАЧНИ_ОТСЮДА.txt
          if (-not (Test-Path dist/RussiaOnline/Studio.exe)) { throw "Studio.exe missing from portable package." }
          if (-not (Test-Path dist/RussiaOnline/Overlay.exe)) { throw "Overlay.exe missing from portable package." }
          if (-not (Test-Path dist/RussiaOnline/Data/laws_database.json)) { throw "Law database missing from portable package." }
          Compress-Archive -Path dist/RussiaOnline/* -DestinationPath dist/RussiaOnline_Studio_Overlay_win-x64.zip -Force
          Get-FileHash dist/RussiaOnline_Studio_Overlay_win-x64.zip -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: RussiaOnlineStudio-Overlay-win-x64
          path: dist/RussiaOnline_Studio_Overlay_win-x64.zip
          retention-days: 14
