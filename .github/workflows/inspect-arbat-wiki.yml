name: Import Arbat catalogue and build Studio + Overlay

on:
  push:
    branches: [development]
    paths:
      - 'scripts/inspect_arbat_wiki.py'
      - '.github/workflows/inspect-arbat-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4
      - name: Import all 27 Arbat documents
        run: python scripts/inspect_arbat_wiki.py
      - name: Validate imported catalogue
        shell: pwsh
        run: |
          $files = @(Get-ChildItem Data/ExtendedLaws -Filter *.json -File)
          if ($files.Count -ne 27) { throw "Expected 27 Arbat documents, found $($files.Count)." }
          $categories = @{}
          $total = 0
          foreach ($file in $files) {
            $law = Get-Content $file.FullName -Raw | ConvertFrom-Json
            if ($law.Server -ne "Арбатский") { throw "Wrong server in $($file.Name): $($law.Server)" }
            if ([string]::IsNullOrWhiteSpace($law.Category)) { throw "Missing full document title in $($file.Name)." }
            if ($categories.ContainsKey($law.Category)) { throw "Duplicate document heading: $($law.Category)" }
            $categories[$law.Category] = $true
            if ($null -eq $law.Articles -or $law.Articles -isnot [array]) { throw "Missing Articles in $($file.Name)." }
            $ids = @($law.Articles | ForEach-Object { $_.Id })
            if ($ids.Count -ne $law.Articles.Count -or ($ids | Sort-Object -Unique).Count -ne $ids.Count) {
              throw "Missing or duplicate article IDs in $($file.Name)."
            }
            if (@($law.Articles | Where-Object { $_.SourceServer -ne "Арбатский" }).Count -gt 0) {
              throw "Article with wrong source server in $($file.Name)."
            }
            $total += $law.Articles.Count
          }
          $manifest = Get-Content Data/law_catalog.json -Raw | ConvertFrom-Json
          if ($manifest.Count -ne 27) { throw "law_catalog.json must contain 27 documents." }
          Write-Host "Validated 27 full-title Arbat documents and $total article/rule entries."
      - name: Commit imported Arbat legal data
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/ExtendedLaws Data/law_catalog.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "data: import 27 legal documents from Arbat catalogue"
            if ($LASTEXITCODE -ne 0) { throw "Could not create data import commit." }
            git pull --rebase origin development
            if ($LASTEXITCODE -ne 0) { throw "Could not rebase imported data onto development." }
            git push origin HEAD:development
            if ($LASTEXITCODE -ne 0) { throw "Could not push imported Arbat data." }
          } else {
            Write-Host "The imported catalogue is already up to date."
          }
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish Studio
        run: dotnet publish src/Studio/Studio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist/RussiaOnline/studio_tmp
      - name: Publish Overlay
        run: dotnet publish src/Overlay/Overlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist/RussiaOnline/overlay_tmp
      - name: Assemble Arbat portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/RussiaOnline/Data | Out-Null
          Copy-Item dist/RussiaOnline/studio_tmp/Studio.exe dist/RussiaOnline/Studio.exe
          Copy-Item dist/RussiaOnline/overlay_tmp/Overlay.exe dist/RussiaOnline/Overlay.exe
          Copy-Item Data/* dist/RussiaOnline/Data/ -Recurse -Force
          Remove-Item dist/RussiaOnline/studio_tmp,dist/RussiaOnline/overlay_tmp -Recurse -Force
          @"
          RUSSIA ONLINE STUDIO + OVERLAY — ARBAT CATALOGUE

          1. Запусти Studio.exe. В библиотеке доступны полные названия 27 документов Арбатского сервера.
          2. Статьи сгруппированы по главам и пунктам; исходные ссылки и дата обновления сохранены в карточке статьи.
          3. Старые записи не удалены: они доступны в отдельном архивном разделе и не смешиваются с действующими документами каталога.
          4. Изменения в Studio автоматически синхронизируются с Overlay.
          5. Запусти Overlay.exe. Горячие клавиши: F8 — выход, F9 — показать/скрыть все окна, F10 — панель управления, F11 — свободное перемещение.
          6. Резервируй Data целиком. При обновлении программы переноси Data/Profiles и Data/overlay_positions.json.
          7. Для встроенного браузера требуется Microsoft Edge WebView2 Runtime.
          "@ | Set-Content -Encoding UTF8 dist/RussiaOnline/НАЧНИ_ОТСЮДА.txt
          if (-not (Test-Path dist/RussiaOnline/Studio.exe)) { throw "Studio.exe missing." }
          if (-not (Test-Path dist/RussiaOnline/Overlay.exe)) { throw "Overlay.exe missing." }
          if (-not (Test-Path dist/RussiaOnline/Data/law_catalog.json)) { throw "Arbat catalogue manifest missing." }
          Compress-Archive -Path dist/RussiaOnline/* -DestinationPath dist/RussiaOnline_Studio_Overlay_Arbat_win-x64.zip -Force
          Get-FileHash dist/RussiaOnline_Studio_Overlay_Arbat_win-x64.zip -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: RussiaOnlineStudio-Overlay-Arbat-win-x64
          path: dist/RussiaOnline_Studio_Overlay_Arbat_win-x64.zip
          retention-days: 14
